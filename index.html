<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b1020" />
<title>Number Scanner</title>
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="bar">
    <h1>Number Scanner</h1>
    <span id="status" class="status">idle</span>
  </header>

  <main>
    <section class="stage">
      <video id="video" playsinline muted autoplay></video>
      <div id="reticle" class="reticle"><span>Align the number inside this box</span></div>
      <div id="dropHint" class="drop-hint">Drop an image, or press Ctrl+V to paste a screenshot</div>
      <canvas id="canvas" hidden></canvas>
    </section>

    <section class="controls">
      <button id="startBtn" class="primary">Start camera</button>
      <button id="flipBtn" disabled>Flip camera</button>
      <button id="torchBtn" hidden>Flash: off</button>
      <button id="screenBtn" hidden>Scan a screen</button>
      <button id="scanBtn" disabled>Scan once</button>
      <button id="liveBtn" disabled>Auto scan: off</button>
      <label class="file">
        Pick image
        <input id="fileInput" type="file" accept="image/*" capture="environment" hidden />
      </label>
    </section>

    <section class="results">
      <div class="results-head">
        <h2>Detected numbers</h2>
        <label class="cc" title="Used for WhatsApp when a number has no country code">
          <span>+</span>
          <input id="dialCode" type="tel" inputmode="numeric" maxlength="4" value="91" aria-label="Default country code" />
        </label>
      </div>
      <div id="bulk" class="bulk" hidden>
        <button id="saveAllBtn">Save all to contacts</button>
        <button id="clearBtn">Clear list</button>
      </div>
      <ul id="list" class="list"></ul>
      <p id="empty" class="empty">Nothing yet. Point the camera at a phone number and tap <b>Scan once</b>.</p>
    </section>

    <details class="raw">
      <summary>Raw recognized text</summary>
      <pre id="rawText"></pre>
    </details>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
